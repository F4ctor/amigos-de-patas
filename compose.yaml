services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: amigosdepatas
      POSTGRES_USER: amigosdepatas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./amigosdepatas_server/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigosdepatas -d amigosdepatas"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./amigosdepatas_server
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: amigosdepatas
      DB_USER: amigosdepatas
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
